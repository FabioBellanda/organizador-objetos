<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Organizador de Objetos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #eaeaea;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-user-select: none;
            user-select: none;
        }
        #app { min-height: calc(100vh - 80px); }
        
        .header {
            padding: 20px;
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 { font-size: 22px; margin-bottom: 5px; }
        .header p { color: #888; font-size: 13px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.98); }
        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card-info { padding: 12px; }
        .card-info h3 {
            font-size: 14px;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-info p {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }
        .empty-state p { margin-bottom: 20px; color: #888; }
        
        .btn-primary {
            background: var(--highlight);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:active { opacity: 0.8; }
        
        .form { padding: 20px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--accent);
            background: var(--bg-card);
            color: var(--text);
            border-radius: 10px;
            font-size: 16px;
        }
        .form-group input::placeholder { color: #666; }
        
        #preview-container {
            display: none;
            margin-top: 12px;
            text-align: center;
        }
        #preview-foto {
            max-width: 100%;
            max-height: 250px;
            border-radius: 10px;
            border: 2px solid var(--accent);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 12px;
        }
        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail { padding: 20px; }
        .detail-img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 20px;
        }
        .detail-info h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--accent);
            font-size: 15px;
        }
        .detail-row .label { color: #888; }
        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-danger {
            flex: 1;
            background: #e94560;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-secondary {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background: #16213e;
            padding: 10px 0;
            border-top: 1px solid #0f3460;
            z-index: 100;
        }
        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #eaeaea;
            font-size: 11px;
            cursor: pointer;
            opacity: 0.5;
            padding: 8px 16px;
        }
        .tab.active { opacity: 1; color: #e94560; }
        .tab span { font-size: 22px; }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            color: #888;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 15px;
            z-index: 200;
            animation: fadeInOut 2s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Carregando...</div>
    </div>
    <div id="tab-bar"></div>
    
    <script>
        const app = document.getElementById('app');
        const tabBar = document.getElementById('tab-bar');
        
        const state = {
            tab: 'home',
            objetos: [],
            busca: '',
            dbReady: false
        };
        
        const DB_NAME = 'OrganizadorObjetos';
        const DB_VERSION = 1;
        const STORE_NAME = 'objetos';
        let db = null;
        
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        const store = database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        store.createIndex('nome', 'nome', { unique: false });
                        store.createIndex('localizacao', 'localizacao', { unique: false });
                    }
                };
            });
        }
        
        function getAllObjetos() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        function addObjeto(objeto) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                objeto.id = crypto.randomUUID();
                objeto.dataCadastro = Date.now();
                const request = store.add(objeto);
                request.onsuccess = () => resolve(objeto);
                request.onerror = () => reject(request.error);
            });
        }
        
        function deleteObjeto(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }
        
        async function loadObjetos() {
            state.objetos = await getAllObjetos();
            state.dbReady = true;
            render();
        }
        
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        function renderTabBar() {
            const tabs = [
                { id: 'home', icon: '🏠', label: 'Início' },
                { id: 'buscar', icon: '🔍', label: 'Buscar' },
                { id: 'adicionar', icon: '➕', label: 'Adicionar' },
                { id: 'galeria', icon: '🖼️', label: 'Galeria' },
                { id: 'backup', icon: '💾', label: 'Backup' }
            ];
            
            let html = '';
            tabs.forEach(t => {
                const active = state.tab === t.id ? 'active' : '';
                html += `<button class="tab ${active}" onclick="setTab('${t.id}')"><span>${t.icon}</span>${t.label}</button>`;
            });
            tabBar.innerHTML = html;
        }
        
        function setTab(tab) {
            state.tab = tab;
            state.busca = '';
            render();
        }
        
        function renderHome() {
            const header = `
                <div class="header">
                    <h1>🎒 Meus Objetos</h1>
                    <p>${state.objetos.length} objeto(s) cadastrado(s)</p>
                </div>
            `;
            
            if (state.objetos.length === 0) {
                app.innerHTML = header + `
                    <div class="empty-state">
                        <p>Nenhum objeto cadastrado.</p>
                        <button class="btn-primary" style="max-width: 250px;" onclick="setTab('adicionar')">Adicionar Primeiro Objeto</button>
                    </div>
                `;
                return;
            }
            
            const sorted = [...state.objetos].sort((a, b) => b.dataCadastro - a.dataCadastro);
            
            let grid = '<div class="grid">';
            sorted.forEach(obj => {
                grid += `
                    <div class="card" onclick="showDetail('${obj.id}')">
                        <img src="${obj.foto}" alt="${obj.nome}" class="card-img">
                        <div class="card-info">
                            <h3>${obj.nome}</h3>
                            <p>📍 ${obj.localizacao} › ${obj.sublocalizacao}</p>
                        </div>
                    </div>
                `;
            });
            grid += '</div>';
            
            app.innerHTML = header + grid;
        }
        
        let fotoBase64 = '';
        
        function renderAdicionar() {
            fotoBase64 = '';
            app.innerHTML = `
                <div class="header">
                    <h1>➕ Adicionar Objeto</h1>
                </div>
                <form class="form" onsubmit="salvarObjeto(event)">
                    <div class="form-group">
                        <label>Nome do Objeto</label>
                        <input type="text" name="nome" required placeholder="Ex: Carregador iPhone">
                    </div>
                    
                    <div class="form-group">
                        <label>Localização Principal</label>
                        <input type="text" name="localizacao" required placeholder="Ex: Gaveteiro X">
                    </div>
                    
                    <div class="form-group">
                        <label>Sublocalização</label>
                        <input type="text" name="sublocalizacao" required placeholder="Ex: Gaveta 01">
                    </div>
                    
                    <div class="form-group">
                        <label>📷 Foto do Objeto</label>
                        <input type="file" name="foto" accept="image/*" capture="environment" required onchange="previewFoto(this)">
                        <div id="preview-container">
                            <img id="preview-foto">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">💾 Salvar Objeto</button>
                </form>
            `;
        }
        
        function previewFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 800;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('preview-foto').src = fotoBase64;
                        document.getElementById('preview-container').style.display = 'block';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        async function salvarObjeto(e) {
            e.preventDefault();
            const form = e.target;
            const objeto = {
                nome: form.nome.value,
                localizacao: form.localizacao.value,
                sublocalizacao: form.sublocalizacao.value,
                foto: fotoBase64
            };
            
            await addObjeto(objeto);
            await loadObjetos();
            setTab('home');
            showToast('Objeto salvo com sucesso!');
        }
        
        function renderBuscar() {
            app.innerHTML = `
                <div class="header">
                    <h1>🔍 Buscar Objetos</h1>
                </div>
                <div style="padding: 20px;">
                    <input type="text" 
                           id="busca-input" 
                           placeholder="Buscar por nome ou local..." 
                           oninput="filtrarBusca(this.value)"
                           style="width: 100%; padding: 14px; border: 1px solid var(--accent); background: var(--bg-card); color: var(--text); border-radius: 10px; font-size: 16px;">
                </div>
                <div id="resultados"></div>
            `;
        }
        
        function filtrarBusca(texto) {
            const termo = texto.toLowerCase();
            
            const filtrados = state.objetos.filter(obj => 
                obj.nome.toLowerCase().includes(termo) || 
                obj.localizacao.toLowerCase().includes(termo) ||
                obj.sublocalizacao.toLowerCase().includes(termo)
            );
            
            const container = document.getElementById('resultados');
            
            if (filtrados.length === 0) {
                container.innerHTML = '<p style="padding: 20px; text-align: center; color: #888;">Nenhum resultado encontrado</p>';
                return;
            }
            
            let html = '<div class="grid">';
            filtrados.forEach(obj => {
                html += `
                    <div class="card" onclick="showDetail('${obj.id}')">
                        <img src="${obj.foto}" alt="${obj.nome}" class="card-img">
                        <div class="card-info">
                            <h3>${obj.nome}</h3>
                            <p>📍 ${obj.localizacao} › ${obj.sublocalizacao}</p>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function renderGaleria() {
            const header = `
                <div class="header">
                    <h1>🖼️ Galeria</h1>
                    <p>Toque em uma foto para ver os detalhes</p>
                </div>
            `;
            
            if (state.objetos.length === 0) {
                app.innerHTML = header + '<p style="padding: 20px; text-align: center; color: #888;">Nenhuma foto cadastrada</p>';
                return;
            }
            
            let grid = '<div class="gallery">';
            state.objetos.forEach(obj => {
                grid += `
                    <div class="gallery-item" onclick="showDetail('${obj.id}')">
                        <img src="${obj.foto}" alt="${obj.nome}">
                    </div>
                `;
            });
            grid += '</div>';
            
            app.innerHTML = header + grid;
        }
        
        function showDetail(id) {
            const obj = state.objetos.find(o => o.id === id);
            if (!obj) return;
            
            app.innerHTML = `
                <div class="detail">
                    <img src="${obj.foto}" class="detail-img">
                    <div class="detail-info">
                        <h2>${obj.nome}</h2>
                        <div class="detail-row">
                            <span class="label">📍 Localização:</span>
                            <span>${obj.localizacao}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">🔖 Sublocalização:</span>
                            <span>${obj.sublocalizacao}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">📅 Cadastrado:</span>
                            <span>${new Date(obj.dataCadastro).toLocaleDateString('pt-BR')}</span>
                        </div>
                        
                        <div class="detail-actions">
                            <button class="btn-danger" onclick="excluirObjeto('${obj.id}')">🗑️ Excluir</button>
                            <button class="btn-secondary" onclick="setTab('home')">← Voltar</button>
                        </div>
                    </div>
                </div>
            `;
            
            tabBar.innerHTML = '';
        }
        
        async function excluirObjeto(id) {
            if (confirm('Tem certeza que deseja excluir este objeto?')) {
                await deleteObjeto(id);
                await loadObjetos();
                showToast('Objeto excluído!');
            }
        }
        
        function renderBackup() {
            const total = state.objetos.length;
            app.innerHTML = `
                <div class="header">
                    <h1>💾 Backup</h1>
                    <p>${total} objeto(s) cadastrado(s)</p>
                </div>
                <div style="padding: 20px;">
                    <p style="margin-bottom: 20px; color: #888; font-size: 14px;">
                        Exporte seus dados para não perder caso precise reinstalar o app.
                    </p>
                    
                    <button class="btn-primary" onclick="exportarBackup()" style="margin-bottom: 12px;">
                        📤 Exportar Backup
                    </button>
                    
                    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--accent);">
                        <p style="margin-bottom: 15px; color: #888; font-size: 14px;">
                            Restaurar backup anterior:
                        </p>
                        <input type="file" id="import-file" accept=".json" onchange="importarBackup(this)" style="display: none;">
                        <button class="btn-secondary" onclick="document.getElementById('import-file').click()" style="width: 100%;">
                            📥 Importar Backup
                        </button>
                    </div>
                </div>
            `;
        }
        
        function exportarBackup() {
            const dados = {
                versao: 1,
                data: new Date().toISOString(),
                objetos: state.objetos
            };
            
            const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-objetos-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Backup exportado com sucesso!');
        }
        
        function importarBackup(input) {
            if (!input.files || !input.files[0]) return;
            
            if (!confirm('Isso irá adicionar todos os objetos do backup aos que já existem. Continuar?')) {
                return;
            }
            
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                try {
                    const dados = JSON.parse(e.target.result);
                    
                    if (!dados.objetos || !Array.isArray(dados.objetos)) {
                        showToast('Arquivo de backup inválido');
                        return;
                    }
                    
                    const total = dados.objetos.length;
                    
                    for (const obj of dados.objetos) {
                        await addObjeto(obj);
                    }
                    
                    await loadObjetos();
                    showToast(`${total} objeto(s) restaurado(s)!`);
                    input.value = '';
                } catch(err) {
                    showToast('Erro ao importar backup');
                    console.error(err);
                }
            };
            
            reader.readAsText(file);
        }
        
        function render() {
            renderTabBar();
            switch(state.tab) {
                case 'home': renderHome(); break;
                case 'buscar': renderBuscar(); break;
                case 'adicionar': renderAdicionar(); break;
                case 'galeria': renderGaleria(); break;
                case 'backup': renderBackup(); break;
            }
        }
        
        async function init() {
            try {
                await initDB();
                await loadObjetos();
            } catch(e) {
                console.error(e);
                app.innerHTML = '<div class="empty-state"><p>Erro ao inicializar banco de dados</p></div>';
            }
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && state.objetos.length > 0) {
                localStorage.setItem('backup_auto', JSON.stringify({
                    data: new Date().toISOString(),
                    objetos: state.objetos
                }));
            }
        });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
        
        init();
    </script>
</body>
</html>
